services:
  postgres:
    image: postgres:17
    container_name: message-hub-postgres
    environment:
      POSTGRES_DB: message_hub_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - message-hub-postgres-data:/var/lib/postgresql/data

  app:
    build: .
    container_name: message-hub-app
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/message_hub_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      DB_PASSWORD: postgres
    ports:
      - "8080:8080"

volumes:
  message-hub-postgres-data: